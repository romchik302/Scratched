  type: Constructor
  source:
    href: https://github.com/romchik302/Vibe_Game/blob/ce9f54115a254c056f6d657d901d3e7a4d51caa9/Vibe_Game/Gameplay/Weapons/ForwardProjectileWeapon.cs
  assemblies:
  - Vibe_Game
  namespace: Vibe_Game.Gameplay.Weapons
  summary: Инициализирует новый экземпляр линейного стрелкового оружия с заданными характеристиками снаряда.
  example: []
  syntax:
    content: public ForwardProjectileWeapon(float cooldownSeconds, float projectileSpeed, int damage, float spawnOffsetPixels, float lifetimeSeconds, float radius = 4, float recoilForce = 150)
    parameters:
    - id: cooldownSeconds
      type: System.Single
      description: Время перезарядки оружия между атаками в секундах.
    - id: projectileSpeed
      type: System.Single
      description: Базовая скорость полета выпускаемого снаряда.
    - id: damage
      type: System.Int32
      description: Базовый урон, наносимый снарядом при столкновении с целью.
    - id: spawnOffsetPixels
      type: System.Single
      description: Смещение точки появления снаряда относительно центра позиции владельца в пикселях.
    - id: lifetimeSeconds
      type: System.Single
      description: Максимальное время жизни снаряда в секундах до его автоматического уничтожения.
    - id: radius
      type: System.Single
      description: Радиус окружности коллизии снаряда в пикселях.
    - id: recoilForce
      type: System.Single
      description: Сила импульса отдачи, прикладываемая к хитбоксу цели при попадании.
    content.vb: Public Sub New(cooldownSeconds As Single, projectileSpeed As Single, damage As Integer, spawnOffsetPixels As Single, lifetimeSeconds As Single, radius As Single = 4, recoilForce As Single = 150)
