- uid: Vibe_Game.Core.Services.GameplayAudio.UpdateGameSceneBgm(System.Boolean,System.Boolean)
  commentId: M:Vibe_Game.Core.Services.GameplayAudio.UpdateGameSceneBgm(System.Boolean,System.Boolean)
  id: UpdateGameSceneBgm(System.Boolean,System.Boolean)
  parent: Vibe_Game.Core.Services.GameplayAudio
  langs:
  - csharp
  - vb
  name: UpdateGameSceneBgm(bool, bool)
  nameWithType: GameplayAudio.UpdateGameSceneBgm(bool, bool)
  fullName: Vibe_Game.Core.Services.GameplayAudio.UpdateGameSceneBgm(bool, bool)
  type: Method
  source:
    href: https://github.com/romchik302/Vibe_Game/blob/ce9f54115a254c056f6d657d901d3e7a4d51caa9/Vibe_Game/Core/Services/GameplayAudio.cs
  assemblies:
  - Vibe_Game
  namespace: Vibe_Game.Core.Services
  summary: >-
    Обновляет фоновую музыку (BGM) в зависимости от текущего состояния комнаты.

    Автоматически переключается между музыкой битвы (с боссом или обычными врагами) 

    и спокойной музыкой исследования. Сохраняет прогресс трека исследования при переключении.
  example: []
  syntax:
    content: public static void UpdateGameSceneBgm(bool bossFightWithLivingBoss, bool combatWithLivingEnemies)
    parameters:
    - id: bossFightWithLivingBoss
      type: System.Boolean
      description: Признак того, идет ли битва с боссом.
    - id: combatWithLivingEnemies
      type: System.Boolean
      description: Признак того, идет ли битва с обычными врагами.
    content.vb: Public Shared Sub UpdateGameSceneBgm(bossFightWithLivingBoss As Boolean, combatWithLivingEnemies As Boolean)
  overload: Vibe_Game.Core.Services.GameplayAudio.UpdateGameSceneBgm*
  nameWithType.vb: GameplayAudio.UpdateGameSceneBgm(Boolean, Boolean)
  fullName.vb: Vibe_Game.Core.Services.GameplayAudio.UpdateGameSceneBgm(Boolean, Boolean)
  name.vb: UpdateGameSceneBgm(Boolean, Boolean)
