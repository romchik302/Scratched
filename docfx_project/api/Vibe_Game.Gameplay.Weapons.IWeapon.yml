  assemblies:
  - Vibe_Game
  namespace: Vibe_Game.Gameplay.Weapons
  summary: Пытается выполнить основную атаку оружия из указанной позиции в заданном направлении.
  example: []
  syntax:
    content: bool TryPrimaryAttack(IAttackContext context, Vector2 ownerPosition, Vector2 facingDirection)
    parameters:
    - id: context
      type: IAttackContext
      description: Контекст боевой системы для регистрации попаданий или спавна снарядов.
    - id: ownerPosition
      type: Microsoft.Xna.Framework.Vector2
      description: Позиция владельца оружия в мировых координатах.
    - id: facingDirection
      type: Microsoft.Xna.Framework.Vector2
      description: Вектор направления атаки.
    return:
      type: System.Boolean
      description: Значение <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>, если атака была успешно произведена; иначе — <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
