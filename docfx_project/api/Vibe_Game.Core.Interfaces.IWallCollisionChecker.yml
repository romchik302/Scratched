    return:
      type: System.Boolean
      description: Значение <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>, если точка пересекается со стеной и проход заблокирован; иначе — <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
